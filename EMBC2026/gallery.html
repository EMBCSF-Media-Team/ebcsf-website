    <div id="image-modal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-image" src="" alt="Expanded Image">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const placeholderGrid = document.getElementById('placeholder-gallery');
            const dynamicGrid = document.getElementById('dynamic-gallery');
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-image');
            const closeModal = document.querySelector('.close-modal');

            // 1. The Watcher: Instantly swaps the placeholder out when live photos arrive
            if (placeholderGrid && dynamicGrid) {
                // A MutationObserver watches the dynamic grid for changes
                const observer = new MutationObserver(function() {
                    if (dynamicGrid.children.length > 0) {
                        placeholderGrid.style.display = 'none'; // Hide placeholders
                        dynamicGrid.style.display = 'grid'; // Show live grid
                        observer.disconnect(); // Stop watching to save memory
                    }
                });
                
                // Tell the observer to watch for new images being added
                observer.observe(dynamicGrid, { childList: true });
            }

            // 2. The Popup Clicker: Works on both placeholder AND live images
            const galleryContainer = document.querySelector('.gallery-container');
            if (galleryContainer && modal && closeModal) {
                galleryContainer.addEventListener('click', function(event) {
                    if (event.target.tagName === 'IMG') {
                        modalImg.src = event.target.src; 
                        modal.style.display = 'flex';    
                    }
                });

                closeModal.addEventListener('click', function() {
                    modal.style.display = 'none';
                });

                window.addEventListener('click', function(event) {
                    if (event.target === modal) {
                        modal.style.display = 'none';
                    }
                });
            }
        });
    </script>
